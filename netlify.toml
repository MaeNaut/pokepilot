[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/smogon-stats/*"
  to = "https://www.smogon.com/stats/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200
  force = true

[[redirects]]
  from = "/app/*"
  to = "/app.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; connect-src 'self' https://play.pokemonshowdown.com https://pokeapi.co https://raw.githubusercontent.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; frame-src https://googleads.g.doubleclick.net https://tpc.googlesyndication.com; img-src 'self' data: blob: https://play.pokemonshowdown.com https://raw.githubusercontent.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com; object-src 'none'; script-src 'self' https://pagead2.googlesyndication.com; style-src 'self' 'unsafe-inline'"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, s-maxage=86400, stale-while-revalidate=604800"
