name: QA

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-qa
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:cloudflare
      - run: npm run audit:all
      - run: npx --no-install wrangler deploy --dry-run --config wrangler.qa.jsonc

      - name: Check that this is still the latest branch commit
        id: release
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          latest=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping deployment: the branch has a newer commit."
          fi

      - name: Apply QA migrations and deploy the separate QA Worker
        if: steps.release.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          npx --no-install wrangler d1 migrations apply pokepilot-qa --remote --config wrangler.qa.jsonc
          npx --no-install wrangler deploy --config wrangler.qa.jsonc

      - name: Verify QA authentication boundary without paid calls
        if: steps.release.outputs.current == 'true'
        run: npm run verify:deployment -- --url https://qa-pokepilot.pokepilot-ai.workers.dev

      - name: Check QA login provisioning without reading secret values
        if: steps.release.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --no-install wrangler secret list --config wrangler.qa.jsonc > "$RUNNER_TEMP/qa-secret-names.json"
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const secrets = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/qa-secret-names.json`, 'utf8'));
          const names = new Set(secrets.map(secret => secret.name));
          const missing = ['GOOGLE_OAUTH_CLIENT_ID', 'GOOGLE_OAUTH_CLIENT_SECRET', 'POKEPILOT_SESSION_SECRET']
            .filter(name => !names.has(name));
          if (missing.length) {
            console.log(`::warning::QA Worker deployed; login setup is incomplete. Missing: ${missing.join(', ')}`);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `## QA bootstrap only\nLogin is not ready. Register these secrets on qa-pokepilot: ${missing.join(', ')}.\n`);
          } else {
            const response = await fetch('https://qa-pokepilot.pokepilot-ai.workers.dev/api/auth/google', {
              redirect: 'manual', signal: AbortSignal.timeout(20000),
            });
            const location = response.headers.get('location');
            if (response.status !== 302 || !location || new URL(location).hostname !== 'accounts.google.com') {
              throw new Error(`QA Google login initiation failed (${response.status}).`);
            }
            console.log('QA Google login initiation: PASS (no paid call).');
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '## QA deployed\nGuest safeguards and Google login initiation passed. Authenticated browser QA remains a separate check.\n');
          }
          NODE
