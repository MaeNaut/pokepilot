name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:cloudflare
      - run: npm run audit:all

      - name: Check deployment credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }

      - name: Check that this is still the latest main commit
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping deployment: main has a newer commit."
          fi

      - name: Apply D1 migrations before deploying the Worker
        if: steps.release.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler d1 migrations apply pokepilot --remote

      - name: Deploy verified build and resume analysis on Cloudflare
        if: steps.release.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy

      - name: Verify production authentication boundary without paid calls
        if: steps.release.outputs.current == 'true'
        run: |
          node --input-type=module <<'NODE'
          let resumed = false;
          for (let attempt = 0; attempt < 30; attempt++) {
            const response = await fetch('https://pokepilot.app/api/pokepilot/analyze', {
              method: 'POST', headers: { Origin: 'https://pokepilot.app' },
              signal: AbortSignal.timeout(20000),
            });
            const result = await response.json();
            resumed = response.status === 401 && result.error?.code === 'AUTH_REQUIRED';
            if (resumed) break;
            const maintenance = response.status === 503 && result.error?.providerAttempted === false &&
              result.error?.message === 'Analysis is temporarily paused for maintenance.';
            if (!maintenance) throw new Error('Unexpected authentication boundary response after deployment.');
            await new Promise(resolve => setTimeout(resolve, 2000));
          }
          if (!resumed) throw new Error('Analysis admission did not resume after deployment.');
          console.log('Analysis resumed; authentication is required.');
          NODE
          npm run verify:deployment

      - name: Verify production service usage aggregates
        if: steps.release.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --no-install wrangler d1 execute pokepilot --remote
          --command "SELECT COUNT(*) AS aggregate_rows, COALESCE(SUM(requests), 0) AS requests FROM service_usage_metrics"
          --json

